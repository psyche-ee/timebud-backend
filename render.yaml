# Render Blueprint for the TimeBud Django API.
# Deploy this repository (timebud-backend/) as a Blueprint. On first sync,
# paste the Neon connection string into the DATABASE_URL prompt.
services:
  - type: web
    name: timebud-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    # Migrations run in the start script because preDeployCommand is paid-only.
    startCommand: bash render-start.sh
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_HOSTS
        value: timebud-backend.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://timebud-frontend.vercel.app
      - key: FRONTEND_URL
        value: https://timebud-frontend.vercel.app
      - key: GOOGLE_CLIENT_ID
        value: 989184819859-p010gku7pfjdhg1dmo4r7r3tjbp37005.apps.googleusercontent.com
      - key: TIME_ZONE
        value: Asia/Manila
      - key: DB_CONN_MAX_AGE
        value: "0"
